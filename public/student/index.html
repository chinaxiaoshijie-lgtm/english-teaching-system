<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生端 - 英语教学互动系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>英语教学互动系统 - 学生端</h1>
            <div class="header-info">
                <span id="studentName"></span>
                <span id="connectionStatus" class="status disconnected">未连接</span>
            </div>
        </header>

        <div id="loginSection" class="login-section">
            <div class="login-card">
                <h2>加入课堂</h2>
                <div class="login-form">
                    <input type="text" id="studentNameInput" placeholder="姓名" class="input">
                    <input type="text" id="studentNumberInput" placeholder="学号" class="input">
                    <button class="btn btn-primary" onclick="joinClass()">加入课堂</button>
                </div>
            </div>
        </div>

        <div id="mainSection" class="main-section" style="display: none;">
            <div id="classroomViewer" style="display:none;">
                <div class="classroom-header">
                    <h3>上课中</h3>
                    <span id="currentLessonTitle"></span>
                </div>
                <div class="slide-container">
                    <img id="studentSlide" src="" alt="课件幻灯片">
                </div>
            </div>

            <nav class="tabs">
                <button class="tab active" data-tab="lesson">课件</button>
                <button class="tab" data-tab="tasks">任务</button>
                <button class="tab" data-tab="submissions">我的提交</button>
            </nav>

            <div class="content">
                <div id="lessonTab" class="tab-content active">
                    <div id="lessonViewer" class="lesson-viewer"></div>
                </div>

                <div id="tasksTab" class="tab-content">
                    <div id="tasksList" class="list"></div>
                </div>

                <div id="submissionsTab" class="tab-content">
                    <div id="submissionsList" class="list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="submissionModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>提交作业</h2>
            <div id="submissionForm"></div>
            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="submitAnswer()">提交</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
